name: Test Suite & Quality Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check sw.js
          node --check activities-data.js
          node --check audio-map.js

      - name: Run all automated test suites
        run: |
          for file in test-*.js; do
            echo "=== Running $file ==="
            # node test-
            node "$file"
          done
