# Netlify Configuration for Bé Học Vui (PWA Static App)

[build]
  publish = "."
  functions = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(self), geolocation=(), payment=()"
    Content-Security-Policy = "default-src 'self' blob: data:; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.ytimg.com https://img.youtube.com; media-src 'self' blob: data: https://api.viettelgroup.ai https://vieneu.com; font-src 'self' data:; connect-src 'self' https://api.viettelgroup.ai https://vieneu.com https://*.google.com https://*.youtube.com; frame-src 'self' https://www.youtube-nocookie.com https://www.youtube.com; object-src 'none'; base-uri 'self';"

# Service worker must NOT be cached
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# HTML must check for updates
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Web App Manifest
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
    Cache-Control = "public, max-age=86400"

# Fonts and images long-term caching
[[headers]]
  for = "/*.ttf"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/bg.webp"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# TTS API endpoint to Netlify serverless function
[[redirects]]
  from = "/api/tts"
  to = "/.netlify/functions/tts"
  status = 200

# SPA redirect fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
