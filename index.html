<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><title>Bé học vui · 4–6 tuổi, làm quen trước lớp 1</title>
<meta name="description" content="Ứng dụng học tập thông minh, tương tác và vui nhộn dành cho bé 4–6 tuổi, làm quen trước lớp 1: Tiếng Việt, Toán học, Tiếng Anh, Đọc hiểu và Luyện viết">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0284c7">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Bé học vui">
<meta name="application-name" content="Bé học vui">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="apple-touch-icon" sizes="512x512" href="icon-512.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="preload" href="font-vn.ttf" as="font" type="font/ttf" crossorigin>
<link rel="preload" href="font-tapviet.ttf" as="font" type="font/ttf" crossorigin>
<link rel="preload" href="font-tapviet-cham.ttf" as="font" type="font/ttf" crossorigin>
<link rel="preload" href="img-core.js" as="script">
<link rel="preload" href="data-vn.js" as="script">
<link rel="preload" href="app.js" as="script">
<link rel="stylesheet" href="styles.css"></head><body>
<div id="app"><header><button class="hb" id="hb" aria-label="Trang chủ"></button><button class="k-bc-back" id="backBtn" onclick="goBack()" style="display:none;min-height:64px;min-width:64px;padding:6px 14px;border-radius:24px;margin-left:4px" aria-label="Quay lại">🔙 <span class="bk-lbl">Quay lại</span></button><span class="sp"></span><button class="badge-btn" id="badgeBtn" onclick="showBadges()" title="Huy hiệu & Cấp độ của bé" aria-label="Bộ sưu tập huy hiệu">🏆 <span id="badgeCount">0</span></button><span class="stars" id="stars" onclick="showBadges()" role="button" tabindex="0" onkeydown="if(event.key==='Enter'||event.key===' ')showBadges()" style="cursor:pointer" title="Điểm sao & Tiến độ của bé" aria-label="Xem điểm sao và cấp độ"></span></header><main id="m"></main></div>
<div id="celebOverlay" class="celeb-overlay" style="display:none" onclick="if(event.target===this)closeCeleb()">
  <div class="celeb-box">
    <button class="celeb-close-btn" onclick="closeCeleb()" aria-label="Đóng">✖</button>
    <div class="celeb-icon" id="celebIcon">🎉</div>
    <h2 class="celeb-title" id="celebTitle">Hoan hô bé!</h2>
    <p class="celeb-desc" id="celebDesc">Bé đã hoàn thành xuất sắc!</p>
    <div class="celeb-stars" id="celebStars">⭐⭐⭐</div>
    <div class="celeb-ctrls">
      <button class="pill on" id="celebBtn" onclick="closeCeleb()" style="font-size:19px;font-weight:800;padding:8px 26px">Tiếp tục nào! 🚀</button>
      <button class="celeb-fx-toggle" id="celebFxToggle" onclick="toggleConfettiFx(event)">🎊 Hiệu ứng pháo hoa: BẬT</button>
    </div>
  </div>
  <canvas id="confettiCv" class="confetti-cv"></canvas>
</div>
<div id="timeLimitModal" class="time-modal" style="display:none">
  <div class="time-box">
    <button class="pin-modal-close" onclick="window.__dismissTimeLimitModal()" aria-label="Đóng">✕</button>
    <div style="font-size:64px;line-height:1;margin-bottom:8px">🌱</div>
    <h2 style="font-size:26px;color:#16a34a;margin:4px 0 8px">Bé học giỏi lắm, cùng nghỉ ngơi nhé! 🌟</h2>
    <p style="font-size:16px;color:#475569;line-height:1.5;margin:4px 0 16px">Hôm nay bé đã rất chăm chỉ! Mình cùng thư giãn đôi mắt xinh và vui đùa một lát nhé. Hẹn gặp lại bé ngày mai! 🎈</p>
    <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:8px">
      <button class="pill" onclick="say('Bé học chăm chỉ quá! Giờ đôi mắt cần được nghỉ ngơi một chút. Chúng mình hẹn gặp lại nhau vào ngày mai nhé, bé ngoan!')" style="font-size:15px;background:#f0fdf4;color:#166534;border-color:#bbf7d0;font-weight:800;min-height:56px">🔊 Nghe bạn mèo dặn</button>
      <button class="pill" onclick="window.__unlockTimeLimit()" style="font-size:15px;background:#fef3c7;color:#92400e;border-color:#f59e0b;font-weight:800;min-height:56px">🔑 Bố mẹ mở thêm 15 phút</button>
    </div>
  </div>
</div>
<div id="parentPinModal" class="time-modal" style="display:none">
  <div class="pin-box" style="margin:0;max-width:360px;width:100%">
    <button class="pin-modal-close" onclick="window.__closeParentPinModal()" aria-label="Đóng">✕</button>
    <div style="font-size:38px;line-height:1">🔒</div>
    <h3 id="parentPinModalTitle" style="margin:8px 0 4px;font-size:20px">Nhập mã PIN phụ huynh</h3>
    <p id="parentPinModalSub" style="font-size:13.5px;color:#64748b;margin:0 0 10px"></p>
    <div class="pin-display" id="parentPinModalDots"></div>
    <div id="parentPinModalErr" style="color:var(--bad);font-weight:800;font-size:13.5px;margin-bottom:8px;min-height:18px"></div>
    <div class="pin-pad" id="parentPinModalPad"></div>
    <p class="pin-msg" id="parentPinModalHelp" style="margin-top:12px"></p>
    <div id="parentPinForgotWrap" style="margin-top:10px;text-align:center">
      <button type="button" onclick="window.__forgotParentPin()" style="background:none;border:none;color:#0284c7;font-size:13.5px;font-weight:700;cursor:pointer;text-decoration:underline;padding:6px;min-height:36px">❓ Quên mã PIN? Bấm vào đây để giải toán mở khóa</button>
    </div>
  </div>
</div>
<img id="cat" alt="Chú mèo bạn đồng hành của bé">
<script src="img-core.js"></script>
<script src="data-vn.js"></script>
<script src="activities-data.js"></script>
<script src="progress.js"></script>
<script src="audio-map.js"></script>
<script src="games/count-game.js"></script>
<script src="games/toddler-games.js"></script>
<script src="games/creative-games.js"></script>
<script src="alphabet.js"></script>
<script src="numbers.js"></script>
<script src="spelling.js"></script>
<script src="app.js"></script>
<script>if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))</script></body></html>
