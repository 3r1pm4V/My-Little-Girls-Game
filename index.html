#app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;max-width:960px;margin:0 auto}
header{display:flex;align-items:center;gap:10px;padding:10px 14px}
header .sp{flex:1}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
.hb{width:54px;height:54px}.hb img{width:100%}
.stars{display:flex;align-items:center;gap:4px;font-size:26px;font-weight:800;background:var(--card);border-radius:30px;padding:2px 14px 2px 8px}
.stars img{width:34px}
.lg{background:var(--card);border-radius:30px;padding:6px 14px;font-weight:800;font-size:18px;border:3px solid var(--acc2)}
main{flex:1;overflow:auto;padding:6px 16px 130px;text-align:center}
small{display:block;font-size:.6em;opacity:.8;font-weight:600}
h1{font-size:clamp(34px,7vw,56px);line-height:1;margin:6px 0 14px}
h2{font-size:clamp(24px,5vw,38px);margin:8px 0;cursor:pointer;line-height:1.1}
.hero img{width:clamp(120px,24vw,190px)}
.cards{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.card{background:var(--card);border-radius:32px;border:6px solid var(--acc);width:clamp(150px,28vw,250px);padding:14px 8px;font-size:clamp(22px,4vw,30px);line-height:1.05;box-shadow:0 8px 0 #0002;transition:transform .12s}
.card:nth-child(2){border-color:var(--acc2)}.card:nth-child(3){border-color:var(--ok)}
.card:active,.opt:active,.chip:active,.ob:active{transform:scale(.94)}
.vis{height:110px;display:flex;align-items:center;justify-content:center;gap:2px;margin-bottom:6px}
.vis img{height:100px}.vis b{font-size:64px;letter-spacing:4px;color:var(--acc)}
.row{display:flex;justify-content:flex-start;margin:4px 0}
.pill{background:var(--card);border:3px solid var(--acc);border-radius:30px;padding:4px 16px;font-size:20px;line-height:1.05;text-align:left}
.stage{display:flex;align-items:center;justify-content:center;gap:12px}
.nav img{width:clamp(50px,10vw,76px)}
.bignum{font-size:clamp(110px,26vw,200px);font-weight:800;line-height:1;color:var(--acc);background:var(--card);border-radius:44px;width:clamp(150px,34vw,260px);border:6px solid var(--acc2);text-shadow:4px 4px 0 #0002}
.word{font-size:28px;margin:6px 0}
.objs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;min-height:80px;margin:6px auto;max-width:640px}
.ob img{width:clamp(48px,11vw,78px)}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:8px}
.chip{width:50px;height:50px;border-radius:50%;background:var(--card);border:3px solid var(--acc2);font-size:26px;font-weight:800}
.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:10px;max-width:760px;margin:8px auto}
.lgrid button{background:var(--card);border-radius:22px;border:4px solid var(--acc2);padding:6px}
.lgrid img{height:70px}
.big{height:clamp(150px,30vw,230px)}
.pair{display:flex;gap:14px;justify-content:center;margin-top:10px;flex-wrap:wrap}
.pair button{background:var(--card);border-radius:28px;border:4px solid var(--acc);padding:10px 16px;font-size:26px;line-height:1.05}
.pair img{height:100px;display:block;margin:0 auto 4px}
.opts{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.opt{min-width:120px;min-height:120px;border-radius:30px;border:5px solid var(--acc2);background:var(--card);padding:10px;box-shadow:0 7px 0 #0002;transition:transform .12s;font-size:20px;line-height:1.05}
.opt img{height:100px}.opt .ans{font-size:80px;font-weight:800;color:var(--acc)}
.opt.good{border-color:var(--ok);background:#d6f7de;color:#244;animation:pop .5s}
.opt.bad{border-color:var(--bad);animation:shake .4s}
.opt.hint{border-color:var(--ok);animation:pulse .8s infinite}.opt.good.hint{animation:pop .5s}
.spr{display:inline-block;width:var(--z);height:var(--z);background-size:800% 100%;background-repeat:no-repeat;background-position:0 0;animation:spr .9s steps(7) forwards}
.pair .spr{display:block;margin:0 auto 4px}
@keyframes spr{to{background-position:100% 0}}
.rr{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--card);border-radius:18px;padding:6px 12px;margin:6px auto;max-width:560px;font-size:22px}
.pill.on{background:var(--acc);color:#fff}
.bignum.two{font-size:clamp(80px,20vw,150px)}
@keyframes pulse{50%{transform:scale(1.1)}}
.cmp .opt{width:clamp(110px,28vw,260px)}
.grp{display:flex;flex-wrap:wrap;gap:2px;justify-content:center}.grp img{width:clamp(26px,5.5vw,44px);height:auto}
.eq{font-size:clamp(50px,12vw,90px);font-weight:800;color:var(--ok);margin-top:8px}

.card{width:clamp(140px,22vw,220px)}

.n{display:block;font-size:34px;font-weight:800;color:var(--acc);line-height:1}
#cat{width:clamp(70px,13vw,140px)}
.opt .grp img{height:auto;width:clamp(26px,5.5vw,44px)}
